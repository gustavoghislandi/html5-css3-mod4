<!DOCTYPE html>
<html lang='pt-BR'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Login</title>
    <!-- IMPORTANTE: OS ÍCONES DEVEM ESTAR EM ORDEM ALFABÉTICA PARA FUNCIONAR -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=key,person" />
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-queries.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                <!-- <img src="imagens/building-peq.jpg" alt=""> -->
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="login.php" method="post">

                    <label for="logi" id="labellog">
                    <span class="material-symbols-outlined">person</span>
                    <input class="field" type="text" name="log" id="logi" placeholder=" seu e-mail">
                    </label>

                    <label for="passi" id="labelpass">
                    <span class="material-symbols-outlined">key</span>
                    <input class="field" type="password" name="pass" id="passi" placeholder=" sua senha">
                    </label>
                    <input type="submit" value="Entrar" id="submiti">
                </form>

                <!-- Alterei a cor deste botão, que fica um pouco melhor esteticamente -->
                <button class=rec-senha>Esqueci a senha</button>
            </div>
        </section>
    </main>
</body>
</html>
