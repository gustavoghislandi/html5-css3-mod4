<!DOCTYPE html>
<html lang='pt-BR'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                <!-- <img src="imagens/building-peq.jpg" alt=""> -->
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="login.php" method="post">

                    <label for="logi" id="labellog">
                    <input type="text" name="log" id="logi" placeholder=" seu e-mail">
                    </label>

                    <label for="passi" id="labelpass">
                    <input type="password" name="pass" id="passi" placeholder=" sua senha">
                    </label>
                    <input type="submit" value="Entrar" id="submiti">
                </form>

            </div>
        </section>
    </main>
